name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - agentic-pipeline-rewrite # Triggers on your current working branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          #dcoker file is at docker/Dockerfile
          file: docker/Dockerfile
          push: true
          # Replace 'yourusername' below with your actual Docker Hub username!
          # It tags the image as 'latest' automatically
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ad-forge:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ad-forge:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ad-forge:buildcache,mode=max